name: Build filetransfer Chinese

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare feed and inject translation
        run: |
          mkdir -p artifacts feed
          git clone --depth=1 https://github.com/jjm2473/openwrt-third.git feed/openwrt-third
          mkdir -p feed/openwrt-third/luci-app-filetransfer/po/zh-cn
          cp translations/filetransfer.po feed/openwrt-third/luci-app-filetransfer/po/zh-cn/filetransfer.po

      - name: Build translation package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: aarch64_cortex-a53
          TARGET: airoha/an7581
          VERSION: master
          FEED_DIR: ${{ github.workspace }}/feed
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          PACKAGES: luci-i18n-filetransfer-zh-cn

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-i18n-filetransfer-zh-cn
          path: artifacts/bin/packages/**/*.apk
