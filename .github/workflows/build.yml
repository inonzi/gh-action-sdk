name: Build luci-app-filetransfer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        uses: openwrt/gh-action-sdk@main
        with:
          arch: aarch64_cortex-a53
          target: airoha/an7581
          version: master
          packages: luci-app-filetransfer
          feeds: |
            src-git openwrt-third https://github.com/jjm2473/openwrt-third.git
