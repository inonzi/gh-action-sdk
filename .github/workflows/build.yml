name: Build filetransfer with Chinese (kenzok8 only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone kenzok8 feed
        run: |
          mkdir -p artifacts feed
          git clone --depth=1 https://github.com/kenzok8/openwrt-packages.git feed/openwrt-packages

      - name: Build package
        uses: kenzok8/gh-action-sdk@main
        env:
          ARCH: aarch64_cortex-a53
          TARGET: airoha/an7581
          VERSION: master
          FEED_DIR: ${{ github.workspace }}/feed
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          FEEDNAME: openwrt-packages
          PACKAGES: luci-app-filetransfer luci-i18n-filetransfer-zh-cn

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-filetransfer-apk
          path: artifacts/bin/packages/**/*.apk
