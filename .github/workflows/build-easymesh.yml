name: Build luci-app-easymesh (APK)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ARCH: aarch64_cortex-a53
  VERSION: snapshots

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package
        uses: immortalwrt/gh-action-sdk@master
        env:
          ARCH: aarch64_cortex-a53
          VERSION: snapshots
          NO_DEFAULT_FEEDS: 1
          EXTRA_FEEDS: |-
            src-git packages https://mirrors.tuna.tsinghua.edu.cn/git/immortalwrt/packages.git
            src-git luci https://mirrors.tuna.tsinghua.edu.cn/git/immortalwrt/luci.git
            src-git routing https://mirrors.tuna.tsinghua.edu.cn/git/immortalwrt/routing.git
            src-git telephony https://mirrors.tuna.tsinghua.edu.cn/git/immortalwrt/telephony.git
            src-git kenzo https://github.com/kenzok8/openwrt-packages
            src-git small https://github.com/kenzok8/small
          PACKAGES: luci-app-easymesh
          V: s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-easymesh-apk
          path: bin/packages/${{ env.ARCH }}/**/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: easymesh-${{ github.run_number }}
          name: EasyMesh APK ${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            bin/packages/${{ env.ARCH }}/**/luci-app-easymesh*.apk
            bin/packages/${{ env.ARCH }}/**/luci-i18n-easymesh*.apk
            bin/packages/${{ env.ARCH }}/**/kmod-batman-adv*.apk
            bin/packages/${{ env.ARCH }}/**/batctl*.apk
            bin/packages/${{ env.ARCH }}/**/wpad-mesh*.apk
