name: Build luci-app-easymesh (APK)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package
        uses: openwrt/gh-action-sdk@v9   # ← 这里改了，官方维护的版本
        env:
          ARCH: aarch64_cortex-a53
          VERSION: snapshots
          EXTRA_FEEDS: |-
            src-git kenzo https://github.com/kenzok8/openwrt-packages
            src-git small https://github.com/kenzok8/small
          PACKAGES: luci-app-easymesh
          V: s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-easymesh-apk
          path: bin/packages/${{ env.ARCH }}/**/*.apk
