name: Build luci-app-easymesh APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dirs and clone feeds
        run: |
          mkdir -p artifacts feed
          # 克隆 kenzok8 的两个源到本地 feed 目录
          git clone --depth=1 https://github.com/kenzok8/openwrt-packages.git feed/openwrt-packages
          git clone --depth=1 https://github.com/kenzok8/small.git feed/small

      - name: Build package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: aarch64_cortex-a53
          TARGET: airoha/an7581
          VERSION: master
          FEED_DIR: ${{ github.workspace }}/feed
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          PACKAGES: luci-app-easymesh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-easymesh-apk
          path: artifacts/bin/packages/**/*.apk
